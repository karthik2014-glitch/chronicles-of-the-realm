<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronicles of the Realm</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <!-- 🟢 FIXED MENU OVERLAY CONTROLLER -->
    <div id="main-menu" onclick="this.style.opacity='0'; setTimeout(()=>{this.style.display='none'},400);">
        <div class="menu-box">
            <h1 class="game-title">CHRONICLES<br><span class="subtitle">OF THE REALM</span></h1>
            
            <div class="pulse-container">
                <p class="menu-hint">CLICK HERE WITH YOUR MOUSE TO START</p>
            </div>

            <div class="controls-guide">
                <div class="guide-row"><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> <span class="action-text">Explore 5 Areas</span></div>
                <div class="guide-row"><span class="key">SPACE</span> <span class="action-text">Attack / Swing Weapon</span></div>
                <div class="guide-row">
                    <span class="key">1</span> Sword 
                    <span class="key">2</span> Staff 
                    <span class="key">3</span> Hammer
                </div>
            </div>
        </div>
    </div>

    <!-- Main Game Viewport Frame Container -->
    <div id="game-viewport">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script src="home.js"></script>
</body>
</html>
